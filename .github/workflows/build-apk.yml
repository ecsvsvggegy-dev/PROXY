name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Apktool
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool

      - name: Verificar arquivos
        run: |
          test -f AndroidManifest.xml
          test -f apktool.yml
          apktool --version

      - name: Compilar APK
        run: apktool b . -o app-debug.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app-debug.apk